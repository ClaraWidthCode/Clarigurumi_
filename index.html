<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarigurumi 🧶</title>
    <link rel="stylesheet" href="/styles/style.css" />
  </head>
  <body>
    <header class="header">
      <img src="/images/LogoClarigurumi.png" alt="Logo Clarigurumi" class="logo" />
      <h1 class="titulo">Clarigurumi</h1>
    </header>

    <main class="contenido">
      <section class="presentacion">
        <h2>Amigurumis tejidos con Claridad 🧵</h2>
        <p>
          Cada pieza es hecha con amor, paciencia y una pizca de magia artesanal.
          Bienvenida a mi mundo de colores y crochet.
        </p>
      </section>

      <section class="catalogo">
        <h3>Catálogo (en construcción)</h3>
        <div class="grid">
          <div class="card">
            <div class="img-placeholder"></div>
            <p>Próximamente...</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2025 Clarigurumi — hecho con 🧶 y 💗 en Medellín</p>
    </footer>
  </body>
</html>
